description: Mindgrove GPIO node

compatible: "mindgrove,gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  interrupts:
    type: array
    required: true
  
  interrupt-names:
    type: string-array
    required: false

  "#gpio-cells":
    type: int
    # const: 2

  config_gpio:
    type: int
    required: true  

  gpio-controller:
    type: boolean
    description: Identifies a node as a GPIO controller.

gpio-cells:
  - pin
  - flags