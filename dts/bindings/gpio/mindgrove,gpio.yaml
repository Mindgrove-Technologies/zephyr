description: Mindgrove GPIO node
compatible: "mindgrove,gpio"
include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  ngpios:
    type: int
    required: true
    description: Number of GPIO pins

  gpio-controller:
    type: boolean

gpio-cells:
  - pin
  - flags