description: >
    This binding gives a base representation of the Mindgrove UART

compatible: "mindgrove,uart"

include: [uart-controller.yaml]

properties:
    reg:
      required: true
    interrupts:
      required: false 
    clock-frequency:
      required: true
    current-speed:
      required: true
    reg-io-width:
      type: int
      required: false
      description: |
        Specify the register access width in bytes (1, 2, or 4).
        Must match the CPU's memory access width for the peripheral bus.
        Defaults to 1 byte (8-bit) if not specified.
      enum:
        - 1 # 8-bit access (uint8_t)
        - 2 # 16-bit access (uint16_t)
        - 4 # 32-bit access (uint32_t)
        