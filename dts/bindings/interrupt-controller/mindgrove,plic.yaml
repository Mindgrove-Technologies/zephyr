description: Mindgrove RISC-V PLIC

compatible: "mindgrove,plic"

include: riscv,plic0.yaml

properties:
  compatible:
    type: string-array
    required: true

  reg:
    type: array
    required: true
    description: PLIC register space
  
  "interrupt-controller":
    type: boolean
    required: true
    description: Convey's this node is an interrupt controller

  "#interrupt-cells":
    type: int
    const: 2
    required: true

  '#address-cells':
    type: int
    required: true
    const: 0
    description: Number of cells to encode a target address

  riscv,max-priority:
    type: int
    required: true
    description: Maximum interrupt priority
  
  riscv,ndev:
    type: int
    description: Number of external interrupts supported
    required: false

  # interrupts-extended:
  #   type: phandle-array
  #   required: false
  #   description: Extended interrupt specifiers
  riscv-irq-aggregator-offset:
    type: int
    required: true
    description: |
        The offset into the system's software interrupt table 
        where this aggregator's interrupt table starts. Must be 0 
        for the first (and typically only) PLIC instance.

interrupt-cells:
  - irq
  - priority
  