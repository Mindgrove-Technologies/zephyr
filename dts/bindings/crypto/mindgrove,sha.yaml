description: |
  Mindgrove SHA-256 hardware accelerator.
  Supports SHA-256 hashing only.
  Polling-based, synchronous operation.

compatible: "mindgrove,sha256"

include: base.yaml

properties:
  reg:
    required: true
    description: |
      Memory-mapped register region for the SHA-256 hardware engine.

  interrupts:
    required: false
    description: |
      Not used. SHA driver operates in polling mode only.

required:
  - reg

