# General
CONFIG_ZTEST=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# DMA Configuration
CONFIG_DMA=y
CONFIG_DMA_MINDGROVE=y
CONFIG_DMA_64BIT=y
CONFIG_DMA_LOOP_TRANSFER_NUMBER_OF_DMAS=1
CONFIG_DMA_TRANSFER_CHANNEL_NR_0=0
CONFIG_DMA_TRANSFER_CHANNEL_NR_1=1

# Interrupt Controller (PLIC)
CONFIG_PLIC=y
CONFIG_MULTI_LEVEL_INTERRUPTS=y
CONFIG_2ND_LEVEL_INTERRUPTS=y
CONFIG_NUM_2ND_LEVEL_AGGREGATORS=1
CONFIG_2ND_LVL_INTR_00_OFFSET=11
CONFIG_MAX_IRQ_PER_AGGREGATOR=82
CONFIG_NUM_IRQS=160
CONFIG_INTC_INIT_PRIORITY=40
CONFIG_DYNAMIC_INTERRUPTS=y

# Logging & Console
CONFIG_SERIAL=y
CONFIG_UART_MINDGROVE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_IMMEDIATE=y