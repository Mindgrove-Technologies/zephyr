# =============================================================================
# Core Kernel
# =============================================================================
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# =============================================================================
# Console / UART
# =============================================================================
CONFIG_SERIAL=y
CONFIG_UART_MINDGROVE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_PRINTK=y

# =============================================================================
# DMA
# =============================================================================
CONFIG_DMA=y
CONFIG_DMA_MINDGROVE=y
CONFIG_DMA_64BIT=y

# =============================================================================
# Interrupt Controller (PLIC)
# =============================================================================
CONFIG_PLIC=y

CONFIG_MULTI_LEVEL_INTERRUPTS=y
CONFIG_2ND_LEVEL_INTERRUPTS=y
CONFIG_NUM_2ND_LEVEL_AGGREGATORS=1
CONFIG_INTC_SINGLE_AGGREGATOR=y

#
# IMPORTANT:
# Your working ztest uses offset=11.
# Keep the SAME configuration here.
#
CONFIG_2ND_LVL_INTR_00_OFFSET=11

#
# Your PLIC supports 81 interrupt sources.
# Use 82 to include source index 0.
#
CONFIG_MAX_IRQ_PER_AGGREGATOR=82

#
# Keep same value as working ztest.
#
CONFIG_NUM_IRQS=160

#
# PLIC initialization priority
#
CONFIG_INTC_INIT_PRIORITY=40

#
# Machine external interrupt priority
#
CONFIG_PLIC_MEIP_PRIORITY=1

# =============================================================================
# ISR Table Generation
# =============================================================================
CONFIG_GEN_ISR_TABLES=y
CONFIG_GEN_SW_ISR_TABLE=y
CONFIG_GEN_IRQ_VECTOR_TABLE=y

#
# Required by your working ztest
#
CONFIG_DYNAMIC_INTERRUPTS=y

# =============================================================================
# IMPORTANT: DISABLE THESE FOR NOW
# =============================================================================

#
# These can break custom PLIC dispatch during bring-up.
# Your ztest does NOT use them.
#

# CONFIG_RISCV_VECTORED_MODE is not set
# CONFIG_IRQ_VECTOR_TABLE_JUMP_BY_CODE is not set

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3