# ---------------- Kernel ----------------
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=256

# ---------------- C Library (ONE only) ----------------
CONFIG_MINIMAL_LIBC=y
CONFIG_MINIMAL_LIBC_RAND=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192


# ---------------- RSA Application enable ----------------
CONFIG_RSA_TEST_OAEP_DECRYPT_01=n
CONFIG_RSA_TEST_OAEP_DECRYPT_02=n
CONFIG_RSA_TEST_OAEP_ENCRYPT=n
CONFIG_RSA_TEST_PKCS_ENC_DEC=n
CONFIG_RSA_TEST_PKCS_SIGN_GEN=n
CONFIG_RSA_TEST_PKCS_SIGN_VERIF=n
CONFIG_RSA_TEST_PSS_SIGN_GEN=y
CONFIG_RSA_TEST_PSS_SIGN_VERIF=n

# ---------------- Heap ----------------
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ---------------- mbedTLS ----------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_CFG_FILE="config-mbedtls.h"
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
# ---------------- CRYPTO ----------------
CONFIG_CRYPTO=y
CONFIG_CRYPTO_MINDGROVE_RSA=y


# ---------------- UART ----------------
CONFIG_SERIAL=y
CONFIG_UART_MINDGROVE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# ---------------- Misc ----------------
CONFIG_SIZE_OPTIMIZATIONS=y