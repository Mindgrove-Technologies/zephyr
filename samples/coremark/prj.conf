# Common coremark configuration
############################################################################

CONFIG_COREMARK=y
# CONFIG_COREMARK_DEBUG=y
# CONFIG_COREMARK_PTHREADS=y
# CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_COREMARK_ZTHREADS=y

CONFIG_COREMARK_MEMORY_METHOD_STACK=y
CONFIG_COREMARK_RUN_TYPE_PERFORMANCE=y
CONFIG_COREMARK_THREADS_NUMBER=2
CONFIG_COREMARK_THREADS_PRIORITY=5
CONFIG_COREMARK_ITERATIONS=1
CONFIG_EXCEPTION_DEBUG=y

CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4

# Add compiler options that are not included by default in Zephyr.
CONFIG_COMPILER_OPT="-O2"

# Configuration variant:
# Memory allocation using the stack memory
# Single-threaded benchmark execution
# Benchmark execution on a button press
############################################################################

# Increse if number of threads increases.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_THREAD_RUNTIME_STATS=n


# CONFIG_DEBUG_COREDUMP=y
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y