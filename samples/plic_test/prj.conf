# =============================================================================
# Mindgrove SoC - GPIO + PLIC interrupt test
# prj.conf
#
# KEY FIXES vs original:
#
# 1. CONFIG_NUM_IRQS: must equal the total flat ISR table size.
#    Formula: NUM_IRQS = 2ND_LVL_INTR_00_OFFSET + MAX_IRQ_PER_AGGREGATOR
#           = 41 + 82 = 123  (covers CPU IRQs 0-40 + PLIC sources 0-81)
#    Original was 16 — far too small, caused wrong offset calculations.
#
# 2. CONFIG_2ND_LVL_INTR_00_OFFSET=41:
#    This is the index in the flat ISR table where PLIC source 0 maps.
#    With offset=41: PLIC source 2 → Zephyr IRQ 43. Matches DT_IRQN(gpio0).
#    Original was 11 (the CPU IRQ line number) — wrong field, wrong value.
#
# 3. CONFIG_MAX_IRQ_PER_AGGREGATOR=82:
#    Must cover all PLIC sources (your PLIC has 81 sources, so use 82).
#    Original was 64 — would silently drop sources 64-81.
#
# 4. Removed duplicate config entries (CONFIG_GEN_SW_ISR_TABLE,
#    CONFIG_GEN_ISR_TABLES, CONFIG_GEN_IRQ_VECTOR_TABLE,
#    CONFIG_NUM_2ND_LEVEL_AGGREGATORS all appeared twice).
#
# 5. Removed contradictory commented/uncommented pairs:
#    CONFIG_2ND_LEVEL_INTERRUPTS was both commented out AND enabled later.
#    Kept only the active assignment.
# =============================================================================

# -----------------------------------------------------------------------------
# Core kernel
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096

# -----------------------------------------------------------------------------
# Console / UART
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_MINDGROVE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_PRINTK=y

# -----------------------------------------------------------------------------
# Interrupt controller
# -----------------------------------------------------------------------------

# Use Zephyr's generic multi-level interrupt support (not the upstream RISCV_PLIC)
# CONFIG_RISCV_HAS_PLIC is intentionally disabled — using custom mindgrove_plic driver
# CONFIG_RISCV_PLIC=y is intentionally disabled — same reason
CONFIG_PLIC=y
CONFIG_MULTI_LEVEL_INTERRUPTS=y
CONFIG_2ND_LEVEL_INTERRUPTS=y
CONFIG_NUM_2ND_LEVEL_AGGREGATORS=1
CONFIG_INTC_SINGLE_AGGREGATOR=y

# PLIC is connected to CPU IRQ line 11 (machine external interrupt).
# CONFIG_2ND_LVL_INTR_00_OFFSET is the flat ISR table index where
# PLIC source 0 starts — NOT the CPU IRQ line number.
# Value must satisfy: DT_IRQN(gpio0) = gpio_plic_source + this_offset
# gpio_plic_source=2, DT_IRQN(gpio0)=43 → offset = 43 - 2 = 41
#CONFIG_2ND_LVL_ISR_TBL_OFFSET=41

# Total flat ISR table size = offset + number of PLIC sources
# 41 (CPU-level slots) + 82 (PLIC sources 0-81) = 123
CONFIG_NUM_IRQS=123

# Must cover all PLIC sources. Your PLIC supports up to source 81.
CONFIG_MAX_IRQ_PER_AGGREGATOR=82

# Priority of the PLIC's own CPU-level interrupt (machine external IRQ 11)
CONFIG_PLIC_MEIP_PRIORITY=1

# Initialization priority for interrupt controller (before drivers)
CONFIG_INTC_INIT_PRIORITY=40

# -----------------------------------------------------------------------------
# ISR table generation
# -----------------------------------------------------------------------------
CONFIG_GEN_ISR_TABLES=y
CONFIG_GEN_SW_ISR_TABLE=y
CONFIG_GEN_IRQ_VECTOR_TABLE=y
CONFIG_IRQ_VECTOR_TABLE_JUMP_BY_CODE=y
CONFIG_DYNAMIC_INTERRUPTS=y

# -----------------------------------------------------------------------------
# Vectored mode
# -----------------------------------------------------------------------------
CONFIG_RISCV_VECTORED_MODE=y

# -----------------------------------------------------------------------------
# GPIO
# -----------------------------------------------------------------------------
CONFIG_GPIO=y
# GPIO driver must NOT auto-connect IRQ — we do it manually in app
# so we can set PLIC priority before enabling
CONFIG_GPIO_MINDGROVE_AUTO_IRQ_CONNECT=n

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3